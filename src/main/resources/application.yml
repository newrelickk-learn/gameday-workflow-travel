server:
  port: 8004

spring:
  application:
    name: gameday-workflow-travel
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gameday_workflow_travel}
    username: ${DATABASE_USERNAME:gameday_user}
    password: ${DATABASE_PASSWORD:gameday_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    root: INFO
