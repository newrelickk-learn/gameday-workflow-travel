apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameday-workflow-travel
  namespace: gameday-workflow
  labels:
    app: gameday-workflow-travel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameday-workflow-travel
  template:
    metadata:
      labels:
        app: gameday-workflow-travel
    spec:
      containers:
        - name: gameday-workflow-travel
          # CIのdeploy.ymlが `sed` でECRイメージに差し替える。初回applyのみこのタグが使われる。
          image: gameday-workflow-travel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-travel-secrets
                  key: database-url
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-travel-secrets
                  key: database-username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-travel-secrets
                  key: database-password
            - name: NEW_RELIC_APP_NAME
              value: "gameday-workflow-travel"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-newrelic-secrets
                  key: license-key
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 60
            periodSeconds: 5
            failureThreshold: 6
        - name: newrelic-infra-sidecar
          # Fargate等でDaemonSetが使えない環境向けに、New Relic Infrastructure Agentを
          # サイドカーとして各Podに同乗させ、そのPod自身のプロセス・リソース使用状況を収集する。
          image: newrelic/infrastructure-bundle:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
          env:
            - name: NRIA_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-newrelic-secrets
                  key: license-key
            - name: NRIA_DISPLAY_NAME
              value: "gameday-workflow-travel"
            - name: CLUSTER_NAME
              value: "Gameday"
            - name: NRIA_OVERRIDE_HOST_ROOT
              value: ""
            - name: FARGATE
              value: "true"
            - name: NRIA_PASSTHROUGH_ENVIRONMENT
              value: "FARGATE"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
